<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>About Me</title>
</head>

<body>

    <header>
        <h1>About Me</h1>
        <p>Welcome to my webpage!</p>
    </header>

    <nav>
        <a href="#about">About</a>
        <a href="#hobbies">Hobbies</a>
        <a href="#contact">Contact</a>
    </nav>

    <main>

        <section id="about">
            <h2>About Me</h2>

            <img src="https://via.placeholder.com/200"
                 alt="My profile image">

            <p>
                Hello! My name is Amreen Taj S.
            </p>
        </section>

        <section id="hobbies">
            <h2>My Hobbies</h2>

            <h3>Things I Like</h3>

            <ul>
                <li>Reading</li>
                <li>Music</li>
                <li>Gaming</li>
                <li>Coding</li>
            </ul>

            <p>
                Learn more at
                <a href="https://www.freecodecamp.org/">
                    freeCodeCamp
                </a>.
            </p>
        </section>

        <section id="contact">
            <h2>Contact Me</h2>

            <form>
                <label for="name">Name:</label>
                <input type="text" id="name" name="name">

                <br><br>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email">

                <br><br>

                <button type="submit">Send</button>
            </form>
        </section>

    </main>

    <footer>
        <p>© 2026 Amreen</p>
    </footer>

</body>
</html>
